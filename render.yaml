services:
  - type: web
    name: spendflow
    env: node
    plan: free
    region: oregon
    buildCommand: npm install && cd backend && npm install && npx prisma generate && npx prisma db push && npx ts-node-dev prisma/seed.ts && npm run build && cd ../frontend && npm install && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        value: file:./dev.db
