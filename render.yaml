services:
  - type: web
    name: spendflow
    env: node
    plan: free
    region: oregon
    buildCommand: cd backend && npm install --include=dev && npx prisma generate && npx prisma db push && npm run build && cd ../frontend && npm install --include=dev && npm run build
    startCommand: cd backend && npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: DATABASE_URL
        value: file:./dev.db
